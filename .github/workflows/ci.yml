# Type check, lint, unit tests and production build on every push and pull request.
# Needs no secrets: tests never use a real Gemini key or Firebase project.
name: CI

on:
  push:
    branches: [main, 'tasks/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Puppeteer's browser is only for the local end-to-end scripts
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npx vitest --run
      - name: Build
        run: npm run build
